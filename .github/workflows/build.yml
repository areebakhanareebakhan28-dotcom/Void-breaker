name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Arrange files
        run: |
          if [ -f Voidbreaker.java ]; then
            mkdir -p src/main/java/com/voidbreaker src/main/resources
            mv Voidbreaker.java src/main/java/com/voidbreaker/
            mv plugin.yml config.yml src/main/resources/
          fi
      - run: mvn -B package
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: target/*.jar
