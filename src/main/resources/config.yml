# Name shown on the item and in the "Crafted" title.
name: Voidbreaker

# Custom 3D model from Voidbreaker-pack.zip (resource pack). Set to "" to keep the vanilla mace look.
model: "voidbreaker:voidbreaker"

# Potion amplifiers: 0 = level I, 1 = level II, 3 = level IV
effects:
  regeneration: 1
  strength: 1
  jump-boost: 3
  extra-hearts: 4

# Soul Barrage: right click (no player in view) -> 3 wither skulls
skulls:
  cooldown: 15
  damage: 8.0
  wither-effect: false

# Telekinesis: right click on a player. Right click again to stop.
telekinesis:
  grab-range: 10.0
  hold-distance: 3.0
  max-seconds: 30

# Void Judgement: sneak + left click -> thrown mace. Locks all powers for the cooldown.
judgement:
  cooldown: 50
  damage: 14.0
  speed: 2.2
  range: 60
  blindness-seconds: 7
  zone-radius: 6.0
  zone-seconds: 8
  skeletons: 3
  skeleton-seconds: 30

# Phantom Step: sprint, jump, then right click in the air. Own cooldown.
phantom:
  cooldown: 30
  distance: 9.0
  rift-radius: 3.0
  rift-seconds: 6
  slow-amplifier: 2
  # Anyone this close to the spot you leave gets Wither + Blindness
  behind-radius: 4.0
  wither-seconds: 3
  wither-amplifier: 1
  blind-seconds: 2

# Void Rift (black hole): jump, then left click in the air. Locks all powers for the cooldown.
rift:
  cooldown: 60

# Black hole: where you aim. Players inside are pulled in, frozen, blinded, can only eat.
# hearts = total hearts lost over the full duration (ignores armor and protection)
blackhole:
  range: 40
  radius: 15
  seconds: 10
  hearts: 8
  pull-speed: 0.35

# Sounds: "sound.id,volume,pitch". Resource-pack sounds work too, e.g. "voidbreaker:kill,1,1"
sounds:
  hit: ["entity.wither.hurt,0.6,0.5", "item.mace.smash_ground,0.7,0.6"]
  kill: ["entity.player.attack.crit,1
